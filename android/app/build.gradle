plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.localium.android'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.localium.android'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('syncWebAssets', Sync) {
    from '../../dist/renderer'
    into 'src/main/assets/web'
}
preBuild.dependsOn syncWebAssets
