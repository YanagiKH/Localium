name: Bootstrap source

on:
  push:
    branches:
      - feature/secure-self-hosted-chat
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/localium.tar.gz
          tar -xzf /tmp/localium.tar.gz
          rm -rf .bootstrap
          rm -rf .github/workflows
          rm -f .gitkeep
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build secure self-hosted Localium chat"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
