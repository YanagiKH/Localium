name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-fund

      - name: Repository verification
        run: npm run verify

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Package (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-fund

      - name: Build unpacked application
        run: npm run package

      - name: Upload packaging result
        uses: actions/upload-artifact@v7
        with:
          name: localium-${{ matrix.os }}-unpacked
          path: release/**
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android build and emulator smoke test
    needs: quality
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Install dependencies
        run: npm install --no-fund

      - name: Build Android debug APK
        run: npm run build:renderer && gradle -p android assembleDebug --no-daemon

      - name: Launch and inspect Android application
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n dev.localium.android/.MainActivity
            sleep 4
            test -n "$(adb shell pidof dev.localium.android | tr -d '\r')"
            adb shell dumpsys activity activities | grep -F dev.localium.android
            adb shell uiautomator dump /sdcard/localium-window.xml
            adb pull /sdcard/localium-window.xml android-window.xml
            test -s android-window.xml
            adb exec-out screencap -p > android-smoke.png
            test -s android-smoke.png

      - name: Upload Android verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: localium-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-window.xml
            android-smoke.png
          if-no-files-found: error
          retention-days: 7
