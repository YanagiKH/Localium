name: Apply Localium 0.2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-v02.yml"
      - "scripts/.apply-v02/**"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Reconstruct and verify migration
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.apply-v02/part-* | base64 --decode | gzip --decompress > /tmp/apply-v02.py
          echo "bc45bb92079e175ad4dd089e49c6fad916c0d6781ba2f2dd9d9bebf18edfab05  /tmp/apply-v02.py" | sha256sum --check
          python -m py_compile /tmp/apply-v02.py

      - name: Apply source migration
        run: python /tmp/apply-v02.py

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/.apply-v02 .github/workflows/apply-v02.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign UI, add avatars, mods, and Android client"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install dependencies
        run: npm install --no-fund

      - name: Verify desktop and shared source
        run: npm run verify

      - name: Build Android debug APK
        run: npm run build:renderer && gradle -p android assembleDebug --no-daemon

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: localium-android-migration-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
