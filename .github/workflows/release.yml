name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "android/**"
      - "src/renderer/**"
      - "src/shared/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-fund

      - name: Verify source
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            asset_glob: |
              release/*.exe
          - name: macos
            os: macos-latest
            asset_glob: |
              release/*.dmg
              release/*.zip
          - name: linux
            os: ubuntu-latest
            asset_glob: |
              release/*.AppImage
              release/*.tar.gz
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-fund

      - name: Build installers
        run: npm run dist -- --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: localium-${{ matrix.name }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Install dependencies
        run: npm install --no-fund

      - name: Build Android release APK
        run: npm run build:renderer && gradle -p android assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: localium-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: localium-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-assets/SHA256SUMS.txt

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#files[@]}" -ge 8
          duplicates="$(printf '%s\n' "${files[@]}" | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate asset names detected:"
            echo "$duplicates"
            exit 1
          fi
          printf '%s\n' "${files[@]}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
