<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Localium administration</title><desc id="desc">Member approval, invitations, roles, appearance, stickers, and audit records</desc>
  <rect width="1600" height="900" fill="#080b13"/><rect x="0" y="0" width="1120" height="900" fill="#0b101b"/><text x="80" y="110" fill="#f1f5ff" font-family="Arial" font-size="44" font-weight="800">Explicit approval before access</text><text x="80" y="154" fill="#94a2b8" font-family="Arial" font-size="18">Pending devices cannot read messages, files, stickers, or room keys.</text>
  <g font-family="Arial"><rect x="80" y="220" width="940" height="140" rx="20" fill="#111a2d" stroke="#ffffff18"/><circle cx="138" cy="290" r="34" fill="#253654"/><text x="124" y="300" fill="#b9d2ff" font-size="26">M</text><text x="195" y="273" fill="#edf3ff" font-size="20" font-weight="700">Mika's laptop</text><text x="195" y="303" fill="#78879d" font-size="14">Requested 2 minutes ago · signed device identity</text><rect x="770" y="265" width="100" height="42" rx="10" fill="#205e49"/><text x="791" y="292" fill="#9cf3d0" font-size="15" font-weight="700">Approve</text><rect x="885" y="265" width="90" height="42" rx="10" fill="#4e1d29"/><text x="906" y="292" fill="#ffabb9" font-size="15" font-weight="700">Reject</text><rect x="80" y="400" width="450" height="250" rx="20" fill="#111a2d" stroke="#ffffff18"/><text x="115" y="445" fill="#edf3ff" font-size="21" font-weight="700">Invitation controls</text><rect x="115" y="480" width="175" height="42" rx="10" fill="#283c65"/><text x="135" y="507" fill="#dfeaff" font-size="14">15-minute code</text><rect x="302" y="480" width="175" height="42" rx="10" fill="#283c65"/><text x="324" y="507" fill="#dfeaff" font-size="14">Permanent code</text><text x="115" y="565" fill="#8fa0b8" font-size="14">• expiration and use counts</text><text x="115" y="594" fill="#8fa0b8" font-size="14">• immediate revocation</text><text x="115" y="623" fill="#8fa0b8" font-size="14">• approval still mandatory</text><rect x="570" y="400" width="450" height="250" rx="20" fill="#111a2d" stroke="#ffffff18"/><text x="605" y="445" fill="#edf3ff" font-size="21" font-weight="700">Custom role permissions</text><g fill="#8fa0b8" font-size="14"><text x="605" y="490">☑ approve members</text><text x="605" y="522">☑ manage invitations</text><text x="605" y="554">☐ manage roles</text><text x="790" y="490">☑ send files</text><text x="790" y="522">☐ view audit</text><text x="790" y="554">☑ manage stickers</text></g><rect x="605" y="586" width="128" height="38" rx="9" fill="#4f80ee"/><text x="627" y="611" fill="white" font-size="14" font-weight="700">Create role</text></g>
  <rect x="1120" y="0" width="480" height="900" fill="#080c16" stroke="#ffffff18"/><text x="1160" y="65" fill="#78a6ff" font-family="Arial" font-size="12" font-weight="700" letter-spacing="3">SERVER CONTROL</text><text x="1160" y="105" fill="#f0f4fc" font-family="Arial" font-size="28" font-weight="700">Administration</text><g font-family="Arial"><text x="1160" y="170" fill="#e5edf8" font-size="18" font-weight="700">Pending approvals</text><rect x="1160" y="195" width="390" height="80" rx="12" fill="#ffffff07"/><text x="1180" y="225" fill="#e8eef9" font-size="15" font-weight="700">Mika's laptop</text><text x="1180" y="250" fill="#718096" font-size="12">Signed request</text><text x="1160" y="330" fill="#e5edf8" font-size="18" font-weight="700">Members & roles</text><text x="1160" y="375" fill="#9aa9bf" font-size="14">Administrator</text><text x="1370" y="375" fill="#6ee7b7" font-size="13">9 permissions</text><text x="1160" y="430" fill="#e5edf8" font-size="18" font-weight="700">Appearance</text><rect x="1160" y="455" width="210" height="40" rx="9" fill="#ffffff08" stroke="#ffffff18"/><text x="1180" y="481" fill="#bdc9da" font-size="13">Encrypted background</text><text x="1160" y="550" fill="#e5edf8" font-size="18" font-weight="700">Recent audit events</text><text x="1160" y="595" fill="#cbd6e7" font-size="13">member.approved</text><text x="1425" y="595" fill="#6f7e94" font-size="11">10:31</text><text x="1160" y="630" fill="#cbd6e7" font-size="13">invite.created</text><text x="1425" y="630" fill="#6f7e94" font-size="11">10:28</text><text x="1160" y="665" fill="#cbd6e7" font-size="13">role.updated</text><text x="1425" y="665" fill="#6f7e94" font-size="11">10:12</text></g>
</svg>
