<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Localium server selection screen</title><desc id="desc">Create, join, and open saved private servers</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c37"/><stop offset=".45" stop-color="#080c17"/><stop offset="1" stop-color="#05070d"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#4f8cff"/><stop offset="1" stop-color="#714af2"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="72" fill="#070a12" fill-opacity=".92"/><rect x="26" y="18" width="36" height="36" rx="11" fill="url(#accent)"/><text x="39" y="45" fill="white" font-family="Arial" font-size="22" font-weight="800">L</text><text x="78" y="45" fill="#eef4ff" font-family="Arial" font-size="22" font-weight="700">Localium</text><circle cx="1230" cy="36" r="5" fill="#36d399"/><text x="1244" y="42" fill="#9dacbf" font-family="Arial" font-size="14">Device identity secured</text><rect x="1435" y="18" width="135" height="36" rx="10" fill="#ffffff08" stroke="#ffffff20"/><text x="1462" y="42" fill="#cdd7e7" font-family="Arial" font-size="14">Debug log</text>
  <rect x="90" y="130" width="950" height="460" rx="28" fill="#121a2cdd" stroke="#ffffff20"/><text x="145" y="195" fill="#79a8ff" font-family="Arial" font-size="14" font-weight="700" letter-spacing="3">PRIVATE INFRASTRUCTURE</text><text x="145" y="270" fill="#f1f5ff" font-family="Arial" font-size="48" font-weight="800">Messages and files stay on</text><text x="145" y="328" fill="#f1f5ff" font-family="Arial" font-size="48" font-weight="800">infrastructure you control.</text><text x="145" y="385" fill="#a9b6ca" font-family="Arial" font-size="19">Create a local server, approve every device, and exchange encrypted content.</text><rect x="145" y="445" width="170" height="52" rx="12" fill="url(#accent)"/><text x="177" y="478" fill="white" font-family="Arial" font-size="17" font-weight="700">Create server</text><rect x="330" y="445" width="220" height="52" rx="12" fill="#ffffff08" stroke="#ffffff22"/><text x="354" y="478" fill="#d9e2f0" font-family="Arial" font-size="17" font-weight="700">Join with invitation</text>
  <rect x="1070" y="130" width="440" height="460" rx="28" fill="#101727dd" stroke="#ffffff20"/><circle cx="1290" cy="320" r="105" fill="none" stroke="#6395ff55"/><circle cx="1290" cy="320" r="74" fill="#182641"/><path d="M1265 315v-25a25 25 0 0 1 50 0v25" fill="none" stroke="#8db6ff" stroke-width="14" stroke-linecap="round"/><rect x="1250" y="313" width="80" height="66" rx="13" fill="#f3f7ff"/><circle cx="1290" cy="344" r="8" fill="#6269e8"/><text x="1130" y="475" fill="#e8effb" font-family="Arial" font-size="24" font-weight="700">Zero-knowledge storage</text><text x="1130" y="512" fill="#92a0b7" font-family="Arial" font-size="16">Encrypted before transmission.</text>
  <rect x="90" y="625" width="1420" height="200" rx="24" fill="#101727dd" stroke="#ffffff20"/><text x="125" y="675" fill="#eaf0fb" font-family="Arial" font-size="24" font-weight="700">Saved servers</text><rect x="125" y="710" width="410" height="82" rx="15" fill="#ffffff08" stroke="#ffffff16"/><rect x="145" y="729" width="44" height="44" rx="12" fill="url(#accent)"/><text x="160" y="759" fill="white" font-family="Arial" font-size="22" font-weight="800">R</text><text x="208" y="744" fill="#eef4ff" font-family="Arial" font-size="17" font-weight="700">Research Department</text><text x="208" y="771" fill="#79889f" font-family="Arial" font-size="13">Hosted on this device</text><text x="500" y="760" fill="#75a3ff" font-family="Arial" font-size="25">→</text>
</svg>
